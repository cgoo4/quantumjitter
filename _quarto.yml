project:
  type: website
  post-render:
    - sitemap.R

execute:
  freeze: auto

website:
  title: "Quantum Jitter"
  favicon: images/favicon.png
  site-url: https://www.quantumjitter.com
  description: "A data science and machine learning blog with the tidyverse at its {{< fa regular heart >}}"
  twitter-card: true
  open-graph: true
  announcement:
    icon: info-circle
    dismissable: true
    content: "New blog post: [Dear humanity,](/blog/dear-humanity/)"
    type: dark
    position: below-navbar
  navbar:
    logo: images/logo-light.png
    logo-alt: "A box and whisker plot icon"
    title: false
    right:
      - text: Projects
        href: project/index.qmd
      - text: Toolbox
        href: project/box/index.qmd
      - text: Blog
        href: blog/index.qmd
      - text: Packages
        menu:
          - text: ggfoundry
            url: https://cgoo4.github.io/ggfoundry
          - text: usedthese
            url: https://cgoo4.github.io/usedthese
      - text: About
        href: about/index.qmd
      - icon: rss
        href: project/index-R.xml
      - icon: github
        menu:
          - text: Source Code
            url:  https://github.com/cgoo4/quantumjitter
          - text: Report a Bug
            url:  https://github.com/cgoo4/quantumjitter/issues
  page-footer:
    border: false
    left: "Published with [Quarto](https://quarto.org/) v<?quarto.version?> | Hosted by [{{< iconify simple-icons netlify >}}](https://www.netlify.com)"
    right: "© 2023 [Carl Goodwin](/about) | [MIT License](https://www.quantumjitter.com/license)"

format:
  html:
    include-in-header:
      text: |
        <!-- Privacy-friendly analytics by Plausible -->
        <script async src="https://plausible.io/js/pa-HYKeHB_pROFRHSROo_lKY.js"></script>
        <script>
          window.plausible = window.plausible || function() {
            (plausible.q = plausible.q || []).push(arguments);
          };
          plausible.init = plausible.init || function(i) {
            plausible.o = i || {};
          };
          plausible.init();
        </script>
    extensions: [mcanouil/iconify]
    canonical-url: true
    theme:
      light: [flatly, scss/light.scss]
      dark: [darkly, scss/dark.scss]
    css: scss/styles.css
    code-link: true
    link-external-icon: true
    link-external-newwindow: true
    smooth-scroll: true
    highlight-style: gruvbox
    df-print: kable
    comments:
      giscus:
        repo: cgoo4/quantumjitter
        category: "Comments"
        mapping: "pathname"
        reactions-enabled: true
        loading: lazy
        input-position: "bottom"
        theme:
          light: light_high_contrast
          dark: dark_dimmed

editor: visual

filters:
  - quarto-version.lua

